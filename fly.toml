app = "settlequote"
primary_region = "iad"

[build]

[env]
  PORT = "8080"
  SQLITE_PATH = "/data/settlequote.db"
  NETWORK = "eip155:84532"
  FACILITATOR_URL = "https://x402.org/facilitator"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "40s"
    interval = "15s"
    method = "GET"
    path = "/health"
    timeout = "5s"

[[mounts]]
  source = "settlequote_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
